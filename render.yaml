# DEPRECATED — DO NOT USE (18 Oct 2026)
# Azure App Service is production (commit f5bb357, "privacy: hosting is Azure
# Sydney (was Render, Oregon)"; see deploy/azure/app-settings.md and
# deploy/azure/MIGRATION.md for the current host). This file still points
# `SUPABASE_URL` at the SAME live production Supabase project Azure uses
# (AUDIT_INFRA.md finding #1): if a Render service were ever (re)deployed from
# this Blueprint, it would be a second, independently-deployed origin writing
# to the one production database — a split-brain risk for sessions, bookings
# and the gate command queue.
# Kept in the repo only as a historical record of the pre-Azure deployment
# shape, per MIGRATION.md's rollback plan (soak Azure for a week before
# retiring Render). Confirm live whether the Render service is actually
# suspended; if the soak period has passed, suspend it and consider deleting
# this file outright rather than just leaving this notice.
services:
  - type: web
    name: balwyn-high-access-portal
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/fencemate2026-pixel/balwyn-high-access-portal
    buildCommand: npm ci --include=dev && npm run build:render
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://aevsfrxqyvtuycufffxk.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PORTAL_SESSION_SECRET
        sync: false
      - key: PORTAL_USERNAME
        sync: false
      - key: PORTAL_OPERATOR_EMAIL
        sync: false
      - key: PORTAL_PASSWORD_HASH
        sync: false
      - key: PORTAL_PASSWORD_SALT
        sync: false
      - key: PORTAL_SETTINGS_PASSWORD_HASH
        sync: false
      - key: PORTAL_SETTINGS_PASSWORD_SALT
        sync: false
      - key: PORTAL_ALLOWED_EMAILS
        sync: false
      - key: PORTAL_OWNER_EMAIL
        sync: false
      - key: PORTAL_ROLE
        sync: false
      - key: PORTAL_SECONDARY_USERNAME
        sync: false
      - key: PORTAL_SECONDARY_OPERATOR_EMAIL
        sync: false
      - key: PORTAL_SECONDARY_OPERATOR_PHONE
        sync: false
      - key: PORTAL_SECONDARY_PASSWORD_HASH
        sync: false
      - key: PORTAL_SECONDARY_PASSWORD_SALT
        sync: false
      - key: PORTAL_SECONDARY_ROLE
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_ALLOWED_EMAILS
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
