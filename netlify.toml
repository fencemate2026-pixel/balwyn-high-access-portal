[build]
command = "npm run build:netlify:verified"
  publish = "out"

[build.environment]
PYTHON_VERSION = "3.12"
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
