# Deploy this directory to the existing Netlify project. The current application
# and its authenticated backend run together on the verified Magic Keys domain.
[build]
  command = "true"
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
